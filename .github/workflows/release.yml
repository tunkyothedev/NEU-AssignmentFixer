name: Build and Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

jobs:
  build-and-release:
    name: Build Windows Portable App & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Executable with PyInstaller
        run: |
          python build_exe.py

      - name: Package Release ZIP and Checksum
        shell: powershell
        run: |
          $ver = "${{ github.event.inputs.tag_name || github.ref_name }}"
          $env:RELEASE_VERSION = $ver
          python package_release.py $ver

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: AssignmentFixer ${{ github.event.inputs.tag_name || github.ref_name }}
          files: |
            dist/releases/*.zip
            dist/releases/*.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
