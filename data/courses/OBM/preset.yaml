assessment_criteria:
- id: D3
  tier: Distinction
  description: Make justified recommendations on how power, politics and culture can
    be used effectively to influence and direct employee behaviour towards the accomplishment
    of organizational goals
- id: M4
  tier: Merit
  description: Evaluate how the operation of power, politics and culture affect employee
    behavior and the accomplishment of organizational goals. Backup your arguments
    with relevant information
