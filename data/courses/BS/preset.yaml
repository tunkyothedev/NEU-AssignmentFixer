course_code: BS
course_name: Business Strategy
unit_title: 'Unit 43: Business Strategy (RQF Level 5)'
program: BTEC Higher National Diploma in Business (RQF) - ISME NEU
formatting:
  font_family: Times New Roman
  font_size_body: 13
  font_size_h1: 15
  font_size_h2: 14
  font_size_h3: 13
  line_spacing: 1.5
  space_after: 6
  margins:
    top: 2.54
    bottom: 2.54
    left: 2.54
    right: 2.54
  citation_style: HARVARD
  require_table_of_contents: true
  require_executive_summary_or_intro: true
  target_word_count: 4500
  word_count_tolerance: 0.1
brief_requirements:
  - section_num: 1
    title: Company Introduction
    word_limit: "<300 words"
    focus: "Company background, temporal milestones, vision, mission, strategic goals, and values."
  - section_num: 2
    title: Macro Environment Analysis
    word_limit: "<1500 words"
    focus: "PESTEL framework, Porter's Five Forces competitive analysis, positioning."
  - section_num: 3
    title: Internal Environment and Capabilities Assessment
    word_limit: "<1200 words"
    focus: "VRIO framework, Value Chain analysis, Core competences, competitive advantages."
  - section_num: 4
    title: Strategic Analysis and Business Strategy Formulation
    word_limit: "<1000 words"
    focus: "SWOT analysis, Ansoff Matrix, Corporate and SBU level strategic directions."
  - section_num: 5
    title: Strategic Management Plan
    word_limit: "<500 words"
    focus: "Critical success factors, tactical implementation plan, resource allocation, KPIs, strategic control, and risk mitigation."
